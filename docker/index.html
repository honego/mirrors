<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Honeok Mirrors 🐇</title>
  <link rel="icon" type="image/svg+xml" href="https://fastly.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg">
  <link rel="shortcut icon" href="https://fastly.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg">

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      max-width: 1000px;
      min-height: calc(100vh - 64px);
      margin: 32px auto;
      padding: 0 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .meta {
      color: #666;
      margin-top: 4px;
    }

    main {
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
    }

    th,
    td {
      padding: 4px 8px;
      border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent);
      white-space: nowrap;
    }

    th {
      text-align: left;
      font-weight: 700;
    }

    .icon {
      width: 20px;
      padding-right: 0;
      text-align: center;
    }

    td.name {
      width: 100%;
      white-space: normal;
      word-break: break-all;
    }

    td.size,
    th.size {
      color: #666;
      text-align: right;
    }

    .entry-icon {
      position: relative;
      display: inline-block;
      width: 14px;
      height: 12px;
      vertical-align: -2px;
    }

    .entry-icon::before,
    .entry-icon::after {
      position: absolute;
      display: block;
      content: "";
      background: currentColor;
    }

    .entry-icon.dir::before {
      top: 1px;
      left: 1px;
      width: 6px;
      height: 3px;
      border-radius: 1px 1px 0 0;
    }

    .entry-icon.dir::after {
      right: 1px;
      bottom: 1px;
      left: 1px;
      height: 9px;
      border-radius: 2px;
    }

    .entry-icon.file::before {
      inset: 1px 3px 1px 3px;
      border-radius: 1px;
    }

    .entry-icon.file::after {
      top: 1px;
      right: 3px;
      width: 4px;
      height: 4px;
      background: Canvas;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
    }

    .entry {
      display: inline-block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: auto;
      padding-top: 28px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      body {
        margin: 22px auto;
      }

      th.size,
      td.size {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Honeok Mirrors 🐇</h1>
    <div class="meta">Index of /docker/</div>

    <div class="meta">
      Base URL:
      <a href="https://mirrors.honeok.com" target="_blank" rel="noopener noreferrer">https://mirrors.honeok.com</a>
    </div>

    <div class="meta">
      Repository:
      <a href="https://github.com/honeokX/mirrors" target="_blank" rel="noopener noreferrer">https://github.com/honeokX/mirrors</a>
    </div>

    <div class="meta">Last Sync: 2026-08-07T16:48:36.490Z</div>
  </header>

  <main>
    <table data-list>
      <thead>
        <tr>
          <th class="icon"></th>
          <th>
            <a href="?C=N&amp;O=A">File Name</a>
            <a href="?C=N&amp;O=D" aria-label="Sort file names descending">&darr;</a>
          </th>
          <th class="size">
            <a href="?C=S&amp;O=A">File Size</a>
            <a href="?C=S&amp;O=D" aria-label="Sort file sizes descending">&darr;</a>
          </th>
        </tr>
      </thead>

      <tbody>
        <tr
          data-type="file"
          data-name="install.sh"
          data-size="22907"
        >
          <td class="icon">
            <span class="entry-icon file" aria-hidden="true"></span>
          </td>
          <td class="name">
            <a class="entry" href="install.sh" title="install.sh">install.sh</a>
          </td>
          <td class="size">22.4 KiB</td>
        </tr>
        <tr
          data-type="file"
          data-name="install.sh.sha256sum"
          data-size="76"
        >
          <td class="icon">
            <span class="entry-icon file" aria-hidden="true"></span>
          </td>
          <td class="name">
            <a class="entry" href="install.sh.sha256sum" title="install.sh.sha256sum">install.sh.sha256sum</a>
          </td>
          <td class="size">76 B</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    Powered by honeok
  </footer>

  <script>
    (() => {
      const table = document.querySelector("[data-list]");
      const tbody = table?.querySelector("tbody");
      if (!table || !tbody) {
        return;
      }

      const rows = Array.from(tbody.querySelectorAll("tr[data-type]"));
      if (rows.length < 2) {
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const column = params.get("C") || "N";
      const order = params.get("O") || "A";
      const direction = order === "D" ? -1 : 1;

      rows.sort((left, right) => {
        const leftType = left.dataset.type === "dir" ? 0 : 1;
        const rightType = right.dataset.type === "dir" ? 0 : 1;
        if (leftType !== rightType) {
          return leftType - rightType;
        }

        if (column === "S") {
          return (Number(left.dataset.size || 0) - Number(right.dataset.size || 0)) * direction;
        }

        return (left.dataset.name || "").localeCompare(
          right.dataset.name || "",
          undefined,
          { numeric: true },
        ) * direction;
      });

      rows.forEach((row) => tbody.appendChild(row));
    })();
  </script>
</body>
</html>
